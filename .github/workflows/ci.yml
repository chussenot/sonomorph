name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal (the `output` feature) links ALSA on Linux. The C engine (the
      # `render` feature) builds with the runner's gcc.
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo fmt --check
        run: cargo fmt --check
      # Each feature on its own, and none: a consumer enables one half
      # without the other, so each must build alone.
      - name: cargo clippy (no features)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy (render)
        run: cargo clippy --all-targets --features render -- -D warnings
      - name: cargo clippy (output)
        run: cargo clippy --all-targets --features output -- -D warnings
      - name: cargo clippy (render-advanced)
        run: cargo clippy --all-targets --features render-advanced -- -D warnings
      - name: cargo clippy (jam)
        run: cargo clippy --all-targets --features jam -- -D warnings
      - name: cargo clippy (midi)
        run: cargo clippy --all-targets --features midi -- -D warnings
      - name: cargo clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-features
        env:
          # The engine's C tests (tests/engine.rs) under ASan and UBSan.
          SONOMORPH_C_SANITIZE: "1"
      # The studio's C modules have their own checks (PROVENANCE.md).
      - name: studio C tests
        working-directory: engine/advanced
        run: |
          set -e
          cc -std=c99 -O2 -Wall -Wextra -Werror -o t tests/test_synth.c studio_synth.c studio_common.c -lm && ./t
          cc -std=c99 -O2 -Wall -Wextra -Werror -o t tests/test_fx.c studio_fx.c studio_common.c -lm && ./t
          cc -std=c99 -O2 -Wall -Wextra -Werror -o t tests/test_sampler.c studio_sampler.c studio_common.c -lm && ./t
          rm -f t
      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo test (rust-version)
        run: cargo test --all-features
